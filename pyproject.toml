[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "delaybind-v08"
version = "0.1.0"
description = "V08 delayed-binding subquery memory runtime for long-context QA"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
test = ["pytest>=8"]
tokenizer = ["transformers"]
tokenizer_json = ["tokenizers>=0.21,<1"]

[tool.setuptools.packages.find]
include = ["delaybind_core*"]
