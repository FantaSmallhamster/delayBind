[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "delaybind-v5"
version = "0.1.0"
description = "Delayed-binding graph working memory runtime for long-context QA"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
test = ["pytest>=8"]
tokenizer = ["transformers"]
tokenizer_json = ["tokenizers>=0.21,<1"]
graph = ["networkx>=3.3"]
v52 = ["tiktoken>=0.7", "syntok==1.4.4"]

[tool.setuptools.packages.find]
include = ["delaybind_core*"]
